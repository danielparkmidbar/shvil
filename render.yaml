# Render Blueprint — 쉬빌 디렉토리 서버 (무료 티어).
# Render 대시보드에서 이 저장소를 연결하면 자동 인식된다.
#
# 무료 티어 주의:
#  - 15분 유휴 시 슬립 → 첫 요청이 ~30초 지연(콜드 스타트).
#  - 디스크가 ephemeral — 재시작·재배포 시 SQLite가 초기화된다(무료엔 영구 디스크 없음).
#    닫힌 시험용으로는 충분. 지속 데이터가 필요하면 유료 디스크 또는 외부 DB로.
#
# ★2026-07-27 — 발행 키는 더 이상 그 SQLite에 있지 않다.
#   SHVIL_ROOT_SEED에서 결정적으로 유도되므로 DB가 몇 번 초기화돼도 같은 키가 나온다
#   (packages/shared/src/keyDerivation.ts). 시드가 없으면 서버는 **기동을 거부한다** —
#   조용히 새 발행자가 되는 것이 이번 사고의 원인이었기 때문이다.
#   ★단 시드가 살리는 것은 **발행 권위**뿐이다. members·certificates·wallet_backups·
#   escrows·발행 수량 카운터·spot_deposits는 재배포마다 여전히 사라진다.
services:
  - type: web
    name: shvil-directory
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # 발행 개인키 봉인 키 — Render가 안전한 랜덤 값을 생성해 주입 (보안 감사 H-2).
      - key: SHVIL_KEK
        generateValue: true
      # ★발행 키 유도 시드 — 이 배포의 발행 권위 전체.
      #   sync: false = Render가 생성하지 않는다. 다니엘 쌤이 대시보드에 직접 넣는다.
      #   자동 생성이 아니라 수동인 이유: 이 값은 **종이에 적어 두어야** 하기 때문이다.
      #   호스팅을 옮기거나 서비스를 다시 만들 때 같은 값을 넣어야 같은 화폐가 유지된다.
      #   생성: node tools/시드생성.mjs
      - key: SHVIL_ROOT_SEED
        sync: false
      # ★선택: 시드 오타를 기계가 잡는 관문. 비밀이 아니다(누구나 /keys에서 본다).
      #   시드를 붙여넣다 한 글자를 틀려도 서버는 **정상 기동한다** — 길이만 맞으면 그것도
      #   훌륭한 시드이기 때문이다. 종이에 적어 둔 배포 열쇠 이름을 여기 넣어 두면
      #   유도 결과가 다를 때 기동을 거부한다. 비워 두면 관문이 꺼진다(사람이 /health로 대조).
      #   값 얻기: node tools/시드생성.mjs (또는 --확인)
      - key: SHVIL_EXPECT_DIST_KEY_ID
        sync: false
      # ★SHVIL_KEY_GENERATION은 **일부러 여기에 두지 않는다** (없으면 0).
      #   블루프린트가 관리하면 다음 sync 때 값이 "0"으로 되돌아가, 유출 때문에 올려 둔
      #   세대가 조용히 원복되고 서버가 **유출된 옛 키로 다시 서명**하게 된다.
      #   회전이 필요하면 Render 대시보드에서 SHVIL_KEY_GENERATION을 직접 추가하고 1씩 올린다.
      #   ★★단 **시드 자체가 유출됐다면 세대를 올려도 소용없다** — 유출자가 같은 시드로
      #   다음 세대를 그대로 유도한다(적대검증 2026-07-28 ②-e 재현). 그때는 새 시드가
      #   필요하고, 새 시드는 곧 **새 발행자**다. docs/서버_키_지속성.md 6장 참조.
      # 닫힌 시험용 dev 라우트(OTP 코드 노출 등) — 공개 운영 시 '0'으로 (C-1).
      - key: SHVIL_DEV_MODE
        value: "1"
